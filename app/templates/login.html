{% extends "base.html" %}
{% block title %}Login — Inbox Job Agent{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h3>Open dashboard</h3>
  <p class="meta">Enter the dashboard password you saved when you deployed.</p>
  <form method="post" action="/login" style="display:flex;gap:8px;margin-top:12px">
    <input type="password" name="key" placeholder="password" autofocus style="flex:1">
    <button type="submit" class="primary">Open</button>
  </form>
</div>
{% endblock %}
