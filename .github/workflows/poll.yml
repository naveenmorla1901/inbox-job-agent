name: poll-inbox

# Free tier: 2,000 min/month on private repos, unlimited on public ones. Actions bills a whole
# minute per run, so every 30 min costs ~1,450 min/month and fits. Public repo? Use "*/15".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_messages:
        description: Messages to process this run
        required: false
        default: "60"

concurrency:
  group: poll-inbox
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'in:inbox -category:promotions' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/jobagent.db' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
      LLM_CHAIN_CLASSIFY: ${{ vars.LLM_CHAIN_CLASSIFY || '' }}
      LLM_CHAIN_EXTRACT: ${{ vars.LLM_CHAIN_EXTRACT || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MIN_JOB_SCORE: ${{ vars.MIN_JOB_SCORE || '0.45' }}
      PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Detect storage backend
        run: |
          if [ "${DATABASE_URL#sqlite}" != "$DATABASE_URL" ]; then
            echo "USE_SQLITE=true" >> "$GITHUB_ENV"
          else
            echo "USE_SQLITE=false" >> "$GITHUB_ENV"
          fi

      # SQLite state is best-effort: Actions caches expire after 7 idle days. For durable
      # history set DATABASE_URL to a free Postgres (Neon / Supabase) instead.
      - name: Restore state
        if: env.USE_SQLITE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobagent-db-${{ github.run_id }}
          restore-keys: jobagent-db-

      - name: Write profile
        run: |
          mkdir -p config data
          if [ -n "$PROFILE_YAML" ]; then
            printf '%s' "$PROFILE_YAML" > config/profile.yaml
          else
            cp config/profile.example.yaml config/profile.yaml
          fi

      - name: Poll
        run: python -m app.run poll --max ${{ github.event.inputs.max_messages || 60 }}

      - name: Save state
        if: ${{ always() && env.USE_SQLITE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: jobagent-db-${{ github.run_id }}
