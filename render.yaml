services:
  - type: web
    name: inbox-job-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LLM_PROVIDER
        value: none
