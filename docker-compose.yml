services:
  dashboard:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./config:/app/config
    restart: unless-stopped

  poller:
    build: .
    env_file: .env
    command: python -m app.run loop --interval 900
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./config:/app/config
    restart: unless-stopped
